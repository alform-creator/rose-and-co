name: Prepare Rose & Co website

on:
  push:
    branches: [main]
    paths:
      - 'rose-co-site.zip'
      - 'roseco50.zip'
      - 'Rose-and-Co-50-Photos-Ready-for-GitHub.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rose-co-static-build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded website ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "roseco50.zip" ]; then
            ZIP="roseco50.zip"
          elif [ -s "Rose-and-Co-50-Photos-Ready-for-GitHub.zip" ]; then
            ZIP="Rose-and-Co-50-Photos-Ready-for-GitHub.zip"
          else
            ZIP="rose-co-site.zip"
          fi
          test -s "$ZIP"
          unzip -t "$ZIP" > /dev/null
          SITE="$RUNNER_TEMP/rose-co-site"
          mkdir -p "$SITE"
          unzip -q "$ZIP" -d "$SITE"
          test -s "$SITE/index.html"
          test -f "$SITE/hy/index.html"
          test -f "$SITE/ru/index.html"
          test -f "$SITE/en/index.html"
          # Remove the decorative Unicode symbol rendered as a green emoji on iOS.
          SITE="$SITE" python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["SITE"])
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              html = html.replace('<span class="h1-flower">✳</span>', '')
              html = html.replace('<span>✳</span>', '')
              page.write_text(html, encoding="utf-8")
          PY
          if [ "$ZIP" = "rose-co-site.zip" ]; then
            python3 .github/scripts/add-gifts.py "$SITE"
          fi
          touch "$SITE/.nojekyll"

      - name: Publish extracted files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/rose-co-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . > /dev/null || true
          cp -a "$SITE/." .
          git add -A
          git commit -m "Publish Rose & Co website for GitHub Pages"
          git push --force origin HEAD:refs/heads/gh-pages
