name: Prepare Rose & Co website

on:
  push:
    branches: [main]
    paths:
      - 'rose-co-site.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rose-and-co-website
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4

      - name: Unpack uploaded website
        shell: bash
        run: |
          set -euo pipefail
          test -s rose-co-site.zip
          unzip -t rose-co-site.zip >/dev/null
          mkdir -p "$RUNNER_TEMP/rose-co-pages"
          unzip -q rose-co-site.zip -d "$RUNNER_TEMP/rose-co-pages"
          test -s "$RUNNER_TEMP/rose-co-pages/index.html"
          touch "$RUNNER_TEMP/rose-co-pages/.nojekyll"

      - name: Publish website files to site branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan site
          git rm -rf . >/dev/null || true
          cp -a "$RUNNER_TEMP/rose-co-pages/." .
          git add -A
          git commit -m "Prepare Rose & Co website for GitHub Pages"
          git push --force origin HEAD:refs/heads/site
