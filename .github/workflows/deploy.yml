name: Prepare Rose & Co website

on:
  push:
    branches: [main]
    paths:
      - 'rose-co-site.zip'
      - 'roseco50.zip'
      - 'Rose-and-Co-50-Photos-Ready-for-GitHub.zip'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/refine-photos.py'
      - '.github/scripts/install-premium-roses.py'
      - '.github/scripts/install-real-photos.py'
      - '.github/scripts/add-animations.py'
      - '.github/scripts/install-bloom-intro.py'
      - '.github/scripts/install-armenian-fonts.py'
      - '.github/scripts/install-brand-logo.py'
      - '.github/scripts/install-journal-features.py'
      - '.github/scripts/final-site-polish.py'
      - '.github/scripts/rose-couture-finish.css'
      - '.github/scripts/install-couture-finish.py'
      - '.github/scripts/couture-qa.py'
      - '.github/scripts/install-story-decor.py'
      - '.github/scripts/install-story-monogram.py'
      - '.github/scripts/install-romantic-runner.py'
      - '.github/scripts/install-floral-experience.py'
      - '.github/scripts/install-rose-services.py'
      - '.github/scripts/final-seo-qa.py'
      - '.github/scripts/install-seo-categories.py'
      - '.github/seo-category-content.json'
      - '.github/scripts/install-final-armenian-typography.py'
      - '.github/scripts/browser-qa.py'
      - '.github/scripts/full-site-qa.py'
      - '.github/scripts/install-admin-panel.py'
      - '.github/admin-panel/**'
      - '.github/admin-data.json'
      - '.github/admin-media/**'
      - '.github/rose-services-data.json'
      - '.github/scripts/install-more-journal.py'
      - '.github/journal-extra-2026/**'
      - '.github/scripts/seo-headings.py'
      - '.rose-customer-2026/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rose-co-static-build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image processing dependency
        run: python3 -m pip install --quiet 'beautifulsoup4>=4.12,<5'

      - name: Extract uploaded website ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "roseco50.zip" ]; then
            ZIP="roseco50.zip"
          elif [ -s "Rose-and-Co-50-Photos-Ready-for-GitHub.zip" ]; then
            ZIP="Rose-and-Co-50-Photos-Ready-for-GitHub.zip"
          else
            ZIP="rose-co-site.zip"
          fi
          test -s "$ZIP"
          unzip -t "$ZIP" > /dev/null
          SITE="$RUNNER_TEMP/rose-co-site"
          mkdir -p "$SITE"
          unzip -q "$ZIP" -d "$SITE"
          test -s "$SITE/index.html"
          test -f "$SITE/hy/index.html"
          test -f "$SITE/ru/index.html"
          test -f "$SITE/en/index.html"
          # Remove the decorative Unicode symbol rendered as a green emoji on iOS.
          SITE="$SITE" python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["SITE"])
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              html = html.replace('<span class="h1-flower">✳</span>', '')
              html = html.replace('<span>✳</span>', '')
              page.write_text(html, encoding="utf-8")
          PY
          if [ "$ZIP" = "rose-co-site.zip" ]; then
            python3 .github/scripts/add-gifts.py "$SITE"
          fi
          python3 .github/scripts/install-real-photos.py "$SITE"
          # Remove the green ✳ decorative symbol from all blog articles in
          # every language. The source archive can reintroduce it on deploy.
          SITE="$SITE" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["SITE"])
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              html = re.sub(
                  r'<div\s+class=["\']article-finish["\']>\s*✳\s*</div>',
                  '', html,
              )
              html = html.replace("✳", "")
              page.write_text(html, encoding="utf-8")
          PY
          python3 .github/scripts/seo-headings.py "$SITE"
          python3 .github/scripts/add-animations.py "$SITE"
          python3 .github/scripts/install-bloom-intro.py "$SITE"
          test -s "$SITE/assets/bloom-intro.js"
          test -s "$SITE/assets/bloom-intro.css"
          test -s "$SITE/assets/rose-motion.js"
          python3 .github/scripts/install-armenian-fonts.py "$SITE"
          grep -q 'Noto+Serif+Armenian' "$SITE/assets/styles.css"
          grep -q 'styles.css?v=armenian1' "$SITE/hy/index.html"
          python3 .github/scripts/install-brand-logo.py "$SITE"
          test -s "$SITE/assets/brand-rose.svg"
          grep -q 'brand-rose-mark' "$SITE/hy/index.html"
          grep -q 'rose-bloom-logo' "$SITE/ru/index.html"
          python3 .github/scripts/install-journal-features.py "$SITE"
          python3 .github/scripts/final-site-polish.py "$SITE"
          python3 .github/scripts/install-more-journal.py "$SITE"
          python3 .github/scripts/install-story-decor.py "$SITE"
          python3 .github/scripts/install-story-monogram.py "$SITE"
          python3 .github/scripts/install-romantic-runner.py "$SITE"
          python3 .github/scripts/install-floral-experience.py "$SITE"
          python3 .github/scripts/install-rose-services.py "$SITE"
          test -s "$SITE/assets/rose-services.css"
          test -s "$SITE/assets/rose-services.js"
          node --check "$SITE/assets/rose-services.js"
          SITE="$SITE" python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import os, json
          root=Path(os.environ["SITE"])
          for lang in ("hy","ru","en"):
              doc=BeautifulSoup((root/lang/"index.html").read_text(encoding="utf-8"),"html.parser")
              for id in ("rose-service-hub","rs-letter","rs-surprise","rs-quiz","rs-delivery","rs-reviews"):
                  assert doc.select_one("#"+id), (lang,id)
              assert doc.select_one("#rs-words") and doc.select_one("#rs-data")
              assert doc.select_one("#rs-surprise-form") and doc.select_one("#rs-review-form")
              assert doc.select_one("#rs-quiz-form") and doc.select_one("#rs-letter-form")
              settings=json.loads(doc.select_one("#rs-data").text)
              assert len(settings["delivery_zones"])==4
              assert all(z["fee_amd"] is None or z["fee_amd"]>=0 for z in settings["delivery_zones"])
          print("All five service modules validated in 3 languages.")
          PY
          test -s "$SITE/assets/rose-experience.css"
          test -s "$SITE/assets/rose-experience.js"
          node --check "$SITE/assets/rose-experience.js"
          # Builder selection, localization and accessible navigation smoke checks.
          SITE="$SITE" python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import os
          root=Path(os.environ['SITE'])
          for lang in ('hy','ru','en'):
              html=(root/lang/'index.html').read_text(encoding='utf-8')
              soup=BeautifulSoup(html,'html.parser')
              section=soup.select_one('#rose-bouquet-builder')
              assert section and section.get('data-lang')==lang
              assert len(section.select('input[name=rose-flower]'))==4
              assert len(section.select('input[name=rose-color]'))==4
              assert len(section.select('input[name=rose-wrap]'))==3
              assert section.select_one('select[name=rose-count]')
              assert section.select_one('.rose-builder-order')
              assert len(soup.select('nav .rose-builder-nav'))==2
              assert soup.select_one('.rose-bloom-ornament')
              assert soup.select_one('script[src*="rose-experience.js"]')
          print('Rose & Co bouquet builder: localized markup smoke checks passed.')
          PY
          grep -q 'id="rose-bouquet-builder"' "$SITE/hy/index.html"
          grep -q 'id="rose-bouquet-builder"' "$SITE/ru/index.html"
          grep -q 'id="rose-bouquet-builder"' "$SITE/en/index.html"
          grep -q 'rose-experience.js?v=atelier3' "$SITE/hy/catalog/index.html"
          test -s "$SITE/assets/romantic-runner.css"
          test -s "$SITE/assets/romantic-runner.js"
          grep -q 'id="rose-runner"' "$SITE/hy/index.html"
          grep -q 'id="rose-runner"' "$SITE/ru/catalog/index.html"
          grep -q 'id="rose-runner"' "$SITE/en/contact/index.html"
          test -s "$SITE/assets/story-rc-monogram.svg"
          grep -q "story-secondary-monogram" "$SITE/hy/index.html"
          grep -q "story-secondary-monogram" "$SITE/ru/about/index.html"
          test -s "$SITE/assets/story-rose-ornament.svg"
          test -s "$SITE/assets/story-floral-spray.svg"
          grep -q "story-decor1" "$SITE/hy/about/index.html"
          test -f "$SITE/hy/journal/pink-rose-bouquets/index.html"
          test -f "$SITE/ru/journal/flowers-at-home/index.html"
          test -f "$SITE/en/journal/flower-boxes-vs-bouquets/index.html"
          test -f "$SITE/hy/journal/bouquet-as-gift/index.html"
          test -f "$SITE/ru/journal/red-roses-51-101/index.html"
          test -f "$SITE/en/journal/ordering-flowers-guide/index.html"
          grep -q 'about-stamp-rose' "$SITE/hy/about/index.html"
          grep -q 'wreaths-05.webp' "$SITE/hy/journal/memorial-wreaths/index.html"
          # Same number for calls and WhatsApp, across all three locales.
          # The website ZIP may include an older saved WhatsApp number.
          SITE="$SITE" python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["SITE"])
          changed = 0
          for ext in ("*.html", "*.js", "*.json"):
              for file in root.rglob(ext):
                  content = file.read_text(encoding="utf-8")
                  updated = (content
                      .replace("37495806009", "37433081898")
                      .replace("095 806 009", "033 081 898")
                      .replace("095806009", "033081898"))
                  if updated != content:
                      file.write_text(updated, encoding="utf-8")
                      changed += 1
          config = root / "assets" / "contact-config.js"
          assert config.exists(), "Missing contact configuration"
          assert "whatsapp: '37433081898'" in config.read_text(encoding="utf-8")
          assert not any("37495806009" in f.read_text(encoding="utf-8") for f in root.rglob("*.html"))
          print("Rose & Co WhatsApp: +37433081898; updated", changed, "files")
          PY
          # Final release gate: audit all 78 pages, fix form ids, canonical,
          # hreflang, OG and sitemap; validate local links, images, H1 and UX.
          python3 -m py_compile .github/scripts/final-seo-qa.py
          # Six purposeful category landing pages per locale, with real product
          # links and original purchase guidance — no thin auto-generated SKU pages.
          python3 -m py_compile .github/scripts/install-seo-categories.py
          python3 .github/scripts/install-seo-categories.py "$SITE"
          test -f "$SITE/hy/collections/romance/index.html"
          test -f "$SITE/ru/collections/wedding/index.html"
          test -f "$SITE/en/collections/wreaths/index.html"
          test -f "$SITE/assets/seo-collections.css"
          python3 .github/scripts/final-seo-qa.py "$SITE"
          python3 .github/scripts/install-final-armenian-typography.py "$SITE"
          python3 -m py_compile .github/scripts/install-admin-panel.py
          python3 .github/scripts/install-admin-panel.py "$SITE"
          # The visual/SEO finish is deliberately last, after administrator edits.
          python3 -m py_compile .github/scripts/install-couture-finish.py
          python3 .github/scripts/install-couture-finish.py "$SITE"
          python3 -m py_compile .github/scripts/couture-qa.py
          python3 .github/scripts/couture-qa.py "$SITE"
          node --check "$SITE/assets/app.js"
          test -s "$SITE/assets/rose-couture-finish.css"
          grep -q 'rc-guide-title' "$SITE/hy/catalog/index.html"
          grep -q 'BreadcrumbList' "$SITE/ru/about/index.html"
          grep -q 'ItemList' "$SITE/en/catalog/index.html"
          test -s "$SITE/admin/index.html"
          test -s "$SITE/admin/admin.js"
          node --check "$SITE/admin/admin.js"
          # Each collection card must link to a stable product ID in the
          # owner-edited catalog, including after admin-panel regeneration.
          SITE="$SITE" python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import os, re, json
          root=Path(os.environ["SITE"])
          data=json.loads(Path(".github/admin-data.json").read_text(encoding="utf-8"))
          for lang in ("hy","ru","en"):
              catalog=BeautifulSoup((root/lang/"catalog/index.html").read_text(encoding="utf-8"),"html.parser")
              ids={x.get("id") for x in catalog.select("#catalog-grid .product-card")}
              expected={"product-"+x["id"] for x in data["products"] if x.get("enabled",True)}
              assert ids==expected, (lang,len(ids),len(expected))
              for page in (root/lang/"collections").glob("*/index.html"):
                  soup=BeautifulSoup(page.read_text(encoding="utf-8"),"html.parser")
                  cards=soup.select(".seo-product-card")
                  assert len(cards)>=4, (page,len(cards))
                  assert all(card["href"].split("#")[-1] in ids for card in cards)
                  assert len(soup.select("main h1"))==1
          print("SEO category deep links verified across 3 languages.")
          PY
          grep -q 'name="robots" content="noindex' "$SITE/admin/index.html"
          test -s "$SITE/assets/armenian-elegance.css"
          grep -q 'armenian-elegance.css' "$SITE/hy/index.html"
          grep -q 'Noto Serif Armenian' "$SITE/assets/armenian-elegance.css"
          test -s "$SITE/sitemap.xml"
          grep -q 'rel="canonical"' "$SITE/hy/index.html"
          grep -q 'rel="canonical"' "$SITE/ru/journal/flower-care/index.html"
          grep -q 'rel="canonical"' "$SITE/en/about/index.html"
          python3 -m pip install --quiet 'selenium>=4.20,<5'
          python3 .github/scripts/browser-qa.py "$SITE"
          python3 -m pip install --quiet 'Pillow>=10,<13'
          python3 -m py_compile .github/scripts/full-site-qa.py
          python3 .github/scripts/full-site-qa.py "$SITE"
          touch "$SITE/.nojekyll"

      - name: Publish extracted files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/rose-co-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . > /dev/null || true
          cp -a "$SITE/." .
          git add -A
          git commit -m "Publish Rose & Co website for GitHub Pages"
          git push --force origin HEAD:refs/heads/gh-pages
