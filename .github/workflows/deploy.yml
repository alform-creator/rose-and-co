name: Prepare Rose & Co website

on:
  push:
    branches: [main]
    paths:
      - 'rose-co-site.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rose-co-static-build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded website ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=rose-co-site.zip
          test -s "$ZIP"
          unzip -t "$ZIP" > /dev/null
          SITE="$RUNNER_TEMP/rose-co-site"
          mkdir -p "$SITE"
          unzip -q "$ZIP" -d "$SITE"
          test -s "$SITE/index.html"
          test -f "$SITE/hy/index.html"
          test -f "$SITE/ru/index.html"
          test -f "$SITE/en/index.html"
          touch "$SITE/.nojekyll"

      - name: Publish extracted files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/rose-co-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . > /dev/null || true
          cp -a "$SITE/." .
          git add -A
          git commit -m "Publish Rose & Co website for GitHub Pages"
          git push --force origin HEAD:refs/heads/gh-pages
